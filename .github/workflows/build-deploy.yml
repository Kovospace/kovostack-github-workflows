name: Reusable build / deploy / cleanup

# Central pipeline for kovospace projects. Callers pass per-project values as
# `inputs` and forward org-level secrets with `secrets: inherit`.
on:
  workflow_call:
    inputs:
      registry:
        description: 'Docker registry host:port (shared self-hosted registry by default)'
        type: string
        required: false
        default: 95.216.187.218:5000
      image_name:
        description: 'Image name (without registry prefix)'
        type: string
        required: true
      compose_dir:
        description: 'Path on the VPS containing docker-compose.yml'
        type: string
        required: true
      build:
        type: boolean
        default: true
      deploy:
        type: boolean
        default: true
      cleanup:
        type: boolean
        default: true
    secrets:
      REGISTRY_USER:     { required: true }
      REGISTRY_PASSWORD: { required: true }
      VPS_HOST:          { required: true }
      VPS_USER:          { required: true }
      VPS_PASSWORD:      { required: true }
      VPS_PORT:          { required: true }

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' && inputs.build
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Allow insecure registry on the host daemon
        run: |
          echo '{"insecure-registries":["${{ inputs.registry }}"]}' | sudo tee /etc/docker/daemon.json
          sudo systemctl restart docker

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
        with:
          # registry is plain HTTP, no TLS — tell buildkit to allow that
          config-inline: |
            [registry."${{ inputs.registry }}"]
              http = true
              insecure = true

      - name: Log in to registry
        uses: docker/login-action@v3
        with:
          registry: ${{ inputs.registry }}
          username: ${{ secrets.REGISTRY_USER }}
          password: ${{ secrets.REGISTRY_PASSWORD }}

      - name: Extract tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ inputs.registry }}/${{ inputs.image_name }}
          tags: |
            type=raw,value=latest
            type=sha,format=short

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    runs-on: ubuntu-latest
    needs: build-and-push
    # Runs when "deploy" is checked, after a successful build OR when build was
    # skipped (deploy-only: uncheck "build" to redeploy the existing `latest`).
    if: >-
      always() &&
      github.ref == 'refs/heads/main' &&
      inputs.deploy &&
      (needs.build-and-push.result == 'success' || needs.build-and-push.result == 'skipped')
    steps:
      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          password: ${{ secrets.VPS_PASSWORD }}
          port: ${{ secrets.VPS_PORT }}
          script: |
            set -e
            export DOCKER_HOST=unix:///run/user/1000/docker.sock
            cd ${{ inputs.compose_dir }}
            # Regenerate .env from env.template, resolving <<<pass/path>>> secrets
            # via the "pass" utility, before the containers start (gopnik-vault).
            export DOCKER_COMPOSES_BASEDIR="$HOME/${{ inputs.compose_dir }}"
            "$HOME/scripts/gopnik-vault.sh"
            docker-compose down
            docker-compose pull
            docker-compose up -d --force-recreate

  cleanup:
    runs-on: ubuntu-latest
    needs: [build-and-push, deploy]
    # Runs last when "cleanup" is checked, as long as nothing upstream failed or
    # was cancelled (skipped is fine, so it works in deploy-only/cleanup-only runs).
    if: >-
      always() &&
      github.ref == 'refs/heads/main' &&
      inputs.cleanup &&
      needs.build-and-push.result != 'failure' && needs.build-and-push.result != 'cancelled' &&
      needs.deploy.result != 'failure' && needs.deploy.result != 'cancelled'
    steps:
      - name: Delete all tags except latest
        env:
          REGISTRY: ${{ inputs.registry }}
          IMAGE_NAME: ${{ inputs.image_name }}
          REGISTRY_USER: ${{ secrets.REGISTRY_USER }}
          REGISTRY_PASSWORD: ${{ secrets.REGISTRY_PASSWORD }}
        run: |
          set -euo pipefail
          base="http://${REGISTRY}/v2/${IMAGE_NAME}"
          auth=(-u "${REGISTRY_USER}:${REGISTRY_PASSWORD}")
          accept=(
            -H "Accept: application/vnd.docker.distribution.manifest.v2+json"
            -H "Accept: application/vnd.oci.image.manifest.v1+json"
            -H "Accept: application/vnd.oci.image.index.v1+json"
            -H "Accept: application/vnd.docker.distribution.manifest.list.v2+json"
          )

          digest_of() {
            curl -fsSI "${auth[@]}" "${accept[@]}" "${base}/manifests/$1" \
              | tr -d '\r' | awk -F': ' 'tolower($1)=="docker-content-digest"{print $2}'
          }

          # `latest` and the freshly built sha tag point at the SAME manifest, so
          # never delete a manifest that latest also references.
          latest_digest=$(digest_of latest || true)
          echo "latest -> ${latest_digest:-<none>}"

          tags=$(curl -fsS "${auth[@]}" "${base}/tags/list" | jq -r '.tags // [] | .[]')
          for tag in $tags; do
            [ "$tag" = "latest" ] && continue
            digest=$(digest_of "$tag" || true)
            if [ -z "$digest" ]; then
              echo "skip ${tag}: no digest"; continue
            fi
            if [ "$digest" = "$latest_digest" ]; then
              echo "skip ${tag}: shares manifest with latest"; continue
            fi
            echo "deleting ${tag} (${digest})"
            curl -fsS -X DELETE "${auth[@]}" "${base}/manifests/${digest}"
          done

      - name: Registry garbage collection and host prune
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          password: ${{ secrets.VPS_PASSWORD }}
          port: ${{ secrets.VPS_PORT }}
          script: |
            set -e
            export DOCKER_HOST=unix:///run/user/1000/docker.sock

            echo "::group::Registry garbage collection"
            docker exec registry /bin/registry garbage-collect --delete-untagged /etc/distribution/config.yml
            echo "::endgroup::"

            echo "::group::Prune unused images"
            docker image prune -a -f
            echo "::endgroup::"

            echo "::group::Prune build cache"
            docker builder prune -f
            echo "::endgroup::"
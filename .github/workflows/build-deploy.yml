name: Reusable build / deploy

# Central pipeline for kovospace projects. Callers pass per-project values as
# `inputs` and forward org-level secrets with `secrets: inherit`.
#
# Deployment is GitOps: this workflow does not talk to the cluster. It commits
# the freshly built image tag into `versions/<app_namespace>.yaml` in the infra
# repo; the cluster's GitOps controller rolls it out from there.
on:
  workflow_call:
    inputs:
      registry:
        description: 'Docker registry host:port (shared self-hosted registry by default)'
        type: string
        required: false
        default: registry.matejkovac.sk
      registry_namespace:
        description: 'Path prefix inside the registry — images live under <registry>/<namespace>/<image_name>'
        type: string
        required: false
        default: apps
      image_name:
        description: 'Image name (without registry or namespace prefix)'
        type: string
        required: true
      app_namespace:
        description: >-
          App namespace — selects versions/<app_namespace>.yaml in the GitOps repo.
          Required when deploying; may be omitted by a build-only caller.
        type: string
        required: false
        default: ''
      image_version:
        description: >-
          Tag to publish the image under, instead of sha-<short sha>. Use it when
          the artifact has a version of its own that consumers pin — a database
          migration image, for example, whose tag IS the schema version. Empty
          keeps the default commit-derived tag.
        type: string
        required: false
        default: ''
      init_image_tags:
        description: >-
          Init-container image tags to pin alongside the application's own, one
          `name=tag` per line. Written to versions/<app_namespace>-init.yaml under
          the `initImageTags` key, which the app chart merges over the application's
          values without disturbing its `imageTag`. Use it for an init container
          built by somebody else's pipeline and carrying a version of its own — a
          migrations image, whose tag IS the schema version this build expects.
          Empty writes no such file and leaves any existing one untouched.
        type: string
        required: false
        default: ''
      gitops_repo:
        description: 'GitOps repository holding the versions/ directory'
        type: string
        required: false
        default: Kovospace/kovostack-infra-gitops
      gitops_branch:
        description: 'Branch of the GitOps repository to commit to'
        type: string
        required: false
        default: main
      release_branch:
        description: >-
          Branch of the *calling* repo that may build/deploy. Empty = the repo's
          default branch, whatever it is called (main, master, …). Set it only to
          release from a non-default branch.
        type: string
        required: false
        default: ''
      build:
        type: boolean
        default: true
      deploy:
        type: boolean
        default: true
    secrets:
      REGISTRY_USER:     { required: true }
      REGISTRY_PASSWORD: { required: true }
      # SSH private key of a deploy key with WRITE access on the GitOps repo.
      # Not required by a build-only caller; `secrets: inherit` supplies it anyway
      # for everyone who does deploy.
      GITOPS_DEPLOY_KEY: { required: false }

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    # Release branch = inputs.release_branch, or the repo's own default branch
    # (main, master, …) when that input is left empty.
    if: >-
      github.ref_name == (inputs.release_branch != '' && inputs.release_branch || github.event.repository.default_branch) &&
      inputs.build
    outputs:
      image_tag: ${{ steps.tag.outputs.image_tag }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Compute image tag
        id: tag
        env:
          IMAGE_VERSION: ${{ inputs.image_version }}
        run: |
          # An explicit version wins; otherwise fall back to the commit, which is
          # what every existing caller relies on.
          if [ -n "$IMAGE_VERSION" ]; then
            echo "image_tag=${IMAGE_VERSION}" >> "$GITHUB_OUTPUT"
          else
            echo "image_tag=sha-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
          fi

      - name: Allow insecure registry on the host daemon
        run: |
          echo '{"insecure-registries":["${{ inputs.registry }}"]}' | sudo tee /etc/docker/daemon.json
          sudo systemctl restart docker

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
        with:
          # registry is plain HTTP, no TLS — tell buildkit to allow that
          config-inline: |
            [registry."${{ inputs.registry }}"]
              http = true
              insecure = true

      - name: Log in to registry
        uses: docker/login-action@v3
        with:
          registry: ${{ inputs.registry }}
          username: ${{ secrets.REGISTRY_USER }}
          password: ${{ secrets.REGISTRY_PASSWORD }}

      - name: Extract tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ inputs.registry }}/${{ inputs.registry_namespace }}/${{ inputs.image_name }}
          tags: |
            type=raw,value=latest
            type=raw,value=${{ steps.tag.outputs.image_tag }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    runs-on: ubuntu-latest
    needs: build-and-push
    # Runs when "deploy" is checked, after a successful build OR when build was
    # skipped (deploy-only: uncheck "build" to re-pin the tag for this commit).
    if: >-
      always() &&
      github.ref_name == (inputs.release_branch != '' && inputs.release_branch || github.event.repository.default_branch) &&
      inputs.deploy &&
      inputs.app_namespace != '' &&
      (needs.build-and-push.result == 'success' || needs.build-and-push.result == 'skipped')
    steps:
      - name: Checkout GitOps repo
        uses: actions/checkout@v4
        with:
          repository: ${{ inputs.gitops_repo }}
          ref: ${{ inputs.gitops_branch }}
          ssh-key: ${{ secrets.GITOPS_DEPLOY_KEY }}
          # full history: the push retry below rebases on top of concurrent deploys
          fetch-depth: 0

      - name: Commit image tag
        env:
          # empty when the build job was skipped — fall back to the same tag the
          # build job would have computed, so a deploy-only run re-pins correctly
          BUILT_TAG: ${{ needs.build-and-push.outputs.image_tag }}
          IMAGE_VERSION: ${{ inputs.image_version }}
          INIT_IMAGE_TAGS: ${{ inputs.init_image_tags }}
          APP_NAMESPACE: ${{ inputs.app_namespace }}
          GITOPS_BRANCH: ${{ inputs.gitops_branch }}
          GITOPS_REPO: ${{ inputs.gitops_repo }}
          SOURCE_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail

          if [ -n "$BUILT_TAG" ]; then
            image_tag="$BUILT_TAG"
          elif [ -n "$IMAGE_VERSION" ]; then
            image_tag="$IMAGE_VERSION"
          else
            image_tag="sha-${GITHUB_SHA::7}"
          fi
          file="versions/${APP_NAMESPACE}.yaml"

          mkdir -p versions
          printf 'imageTag: %s\n' "$image_tag" > "$file"

          # Init containers whose tag is not this build's own — a migrations image
          # published by its own pipeline, pinned here to the version this build was
          # written against. They go in a separate file under a separate key, so the
          # two version files never overwrite each other; the chart merges them.
          init_summary=''
          init_body=''
          while IFS= read -r entry; do
            entry=$(printf '%s' "$entry" | tr -d '[:space:]')
            [ -n "$entry" ] || continue
            name=${entry%%=*}
            tag=${entry#*=}
            if [ "$name" = "$entry" ] || [ -z "$name" ] || [ -z "$tag" ]; then
              echo "::error::init_image_tags entry '${entry}' is not name=tag" >&2
              exit 1
            fi
            # Quoted deliberately: an unquoted 1.2 is a YAML float, not a tag.
            init_body="${init_body}$(printf '  %s: "%s"' "$name" "$tag")"$'\n'
            init_summary="${init_summary}${init_summary:+, }${name}=${tag}"
          done <<< "$INIT_IMAGE_TAGS"

          # Written only when there is something to write: an empty input must not
          # truncate a file some other run put there.
          if [ -n "$init_summary" ]; then
            init_file="versions/${APP_NAMESPACE}-init.yaml"
            printf 'initImageTags:\n%s' "$init_body" > "$init_file"
            echo "${init_file} -> ${init_summary}"
          fi

          git config user.name  'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add "$file"
          if [ -n "$init_summary" ]; then
            git add "$init_file"
          fi

          if git diff --cached --quiet; then
            echo "${file} already at ${image_tag}${init_summary:+ (init: ${init_summary})} — nothing to commit"
            exit 0
          fi

          body="From ${SOURCE_REPO}@${GITHUB_SHA}"
          if [ -n "$init_summary" ]; then
            body="${body}"$'\n'"init containers: ${init_summary}"
          fi

          git commit -m "${APP_NAMESPACE}: ${image_tag}" -m "$body"

          # Other projects push to this repo too — rebase and retry on races.
          for attempt in 1 2 3 4 5; do
            if git push origin "HEAD:${GITOPS_BRANCH}"; then
              echo "pushed ${file} -> ${image_tag}"
              exit 0
            fi
            echo "push rejected (attempt ${attempt}), rebasing…"
            sleep $(( RANDOM % 5 + 1 ))
            git pull --rebase origin "${GITOPS_BRANCH}"
          done

          echo "could not push to ${GITOPS_REPO} after 5 attempts" >&2
          exit 1